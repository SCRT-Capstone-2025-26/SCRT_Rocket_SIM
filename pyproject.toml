[project]
name = "scrt"
version = "1.0"
description = "SCRT Simulation"
readme = "README.md"
license-files = ["LICENSE"]
dependencies = [
    "matplotlib==3.10.9",
    "numpy==2.4.4",
    "scipy==1.17.0",
]

[optional-dependencies]
dev = [
    "pytest==9.0.3",
]

[build-system]
requires = [
    "setuptools>=60",
    "setuptools-scm>=8.0"
]

[tool.setuptools]
package-dir = {"scrt" = "simulation"}
include-package-data = true

[tool.setuptools.package-data]
scrt = ["*.csv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "N"]
