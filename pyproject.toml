[project]
name = "scrt"
version = "1.0"
description = "SCRT Simulation"
readme = "README.md"
license-files = ["LICENSE"]

[tool.setuptools]
package-dir = {"scrt" = "simulation"}
include-package-data = true

[tool.setuptools.package-data]
"scrt" = ["simulation/data/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "N"]
